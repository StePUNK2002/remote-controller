<script>
// Очередь запросов и система повторных попыток
const requestQueue = [];
let isProcessing = false;
const MAX_RETRIES = 3;
const RETRY_DELAY = 500; // 0.5 секунды


async function RightClickUp() {
    const url = '/mouse/right_click'; // URL вашего API
    
    const requestData = {};
    
    try {
        const response = await fetch(url, {
            method: 'POST', // или другой метод, который использует ваш API
            headers: {
                'Content-Type': 'application/json',
                // Добавьте другие заголовки если нужно
            },
            body: JSON.stringify(requestData)
        });
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        return data;
    } catch (error) {
        console.error('Error sending mouse offset request:', error);
        throw error;
    }
}


// Функция для обработки очереди запросов
function processQueue() {
    if (isProcessing || requestQueue.length === 0) return;

    isProcessing = true;
    const { url, data, retries = 0, onSuccess } = requestQueue.shift();

    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');

    xhr.onload = function() {
        if (xhr.status >= 200 && xhr.status < 300) {
            if (onSuccess) onSuccess();
            isProcessing = false;
            setTimeout(processQueue, 0); // Обработать следующий запрос
        } else {
            handleRequestError(url, data, retries, onSuccess);
        }
    };

    xhr.onerror = function() {
        handleRequestError(url, data, retries, onSuccess);
    };

    xhr.send(data);
}

function handleRequestError(url, data, retries, onSuccess) {
    if (retries < MAX_RETRIES) {
        // Повторная попытка после задержки
        setTimeout(() => {
            requestQueue.unshift({ url, data, retries: retries + 1, onSuccess });
            isProcessing = false;
            processQueue();
        }, RETRY_DELAY * (retries + 1));
    } else {
        // Максимальное количество попыток достигнуто
        console.error(`Request to ${url} failed after ${MAX_RETRIES} attempts`);
        isProcessing = false;
        setTimeout(processQueue, 0); // Продолжить с другими запросами
    }
}

// Функция для добавления запроса в очередь с учетом приоритета
function addToQueueWithPriority(url, data, onSuccess = null) {
    const newRequest = { url, data, onSuccess };

    if (url === '/click') {
        // Для /click вставляем в начало очереди
        requestQueue.unshift(newRequest);
    } else if (url === '/qwe') {
        // Для /qwe проверяем, есть ли /click в очереди
        const clickIndex = requestQueue.findIndex(req => req.url === '/click');

        if (clickIndex !== -1) {
            // Если есть /click, вставляем /qwe после него
            requestQueue.splice(clickIndex + 1, 0, newRequest);
        } else {
            // Иначе добавляем в конец
            requestQueue.push(newRequest);
        }
    } else {
        // Для других запросов просто добавляем в конец
        requestQueue.push(newRequest);
    }

    processQueue();
}

function sendRequest(startx, starty) {
    addToQueueWithPriority('/click', 'xcoord=' + startx + '&ycoord=' + starty);
}

function sendRequest2(dist, dist2) {
    mouseClickUp()
}

var inputField = document.getElementsByName('my_input')[0];
inputField.value = '11111111111';
document.getElementById("my_input").addEventListener("input", function() {
  if (this.value.length <= 10) {
    this.value = inputField.value = '111111111111111111111111111111111111111111';
  }
});

function showKeyboard() {
  var inputField = document.getElementsByName('my_input')[0];
  inputField.focus();
}

function isContained(m, e) {
  var e=e||window.event;
  var c=/(click)|(mousedown)|(mouseup)/i.test(e.type)? e.target : ( e.relatedTarget || ((e.type=="mouseover")? e.fromElement : e.toElement) );
  while (c && c!=m)try {c=c.parentNode} catch(e) { c=m; }
  if (c==m) return true;
  else return false;
}

document.addEventListener('keydown', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
    }
    
    // Используем key вместо key.toLowerCase() для сохранения регистра
    const keyName = event.key;
    
    // Кодируем для URL
    const encodedName = encodeURIComponent(keyName);
    
    fetch(`/keyboard/press_and_release?button_name=${encodedName}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
        },
    })
    .then(response => {
        if (!response.ok) {
            console.error('Ошибка:', response.status);
        }
        return response.json();
    })
    .then(data => {
        console.log('Клавиша:', keyName, 'Ответ:', data);
    })
    .catch(error => {
        console.error('Ошибка:', error);
    });
});

window.addEventListener('load', function() {
  var box1 = document.getElementById('box1');
  var statusdiv = document.getElementById('statusdiv');
  var startx = 0;
  var starty = 0;
  var dist = 0;
  var dist2 = 0;
  var right = 0;
  var last = 0;
  var fingers = 0;
  var isBlocked = false;
  var click = 0;
  var scroll = false;

  var detecttouch = !!('ontouchstart' in window) || !!('ontouchstart' in document.documentElement) ||
                    !!window.ontouchstart || !!window.Touch || !!window.onmsgesturechange ||
                    (window.DocumentTouch && window.document instanceof window.DocumentTouch);
  var ismousedown = false;


   async function mouseClickDown() {
    const url = '/mouse/click_down'; // URL вашего API
    
    const requestData = {};
    
    try {
        const response = await fetch(url, {
            method: 'POST', // или другой метод, который использует ваш API

}


async function mouseClickUp() {
    const url = '/mouse/click_up'; // URL вашего API
    
    const requestData = {};
    
    try {
        const response = await fetch(url, {
            method: 'POST', // или другой метод, который использует ваш API

}


  box1.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touchobj = e.changedTouches[0];
    startx = parseInt(touchobj.clientX);
    starty = parseInt(touchobj.clientY);
    statusdiv.innerHTML = 'Событие: touchstart<br /> ClientX: ' + startx + 'px';
    if (e.touches.length > fingers) {
      fingers = e.touches.length;
    }
    if (e.touches.length == 1) {
      click = click + 1;
      if (click == 2) {
        mouseClickDown();
      }
    }
  }, false);

  async function mouseoffset(startx, starty) {
    const url = '/mouse/offset'; // URL вашего API
    
    const requestData = {
        offset_axis_x: startx,
        offset_axis_y: starty
    };
    
    try {
        const response = await fetch(url, {
            method: 'POST', // или другой метод, который использует ваш API
            headers: {
                'Content-Type': 'application/json',
                // Добавьте другие заголовки если нужно
            },
            body: JSON.stringify(requestData)
        });
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        return data;
    } catch (error) {
        console.error('Error sending mouse offset request:', error);
        throw error;
    }
}

  box1.addEventListener('touchmove', function(e) {
    var touchobj = e.changedTouches[0];
    var dist = parseInt(touchobj.clientX) - startx;
    var dist2 = parseInt(touchobj.clientY) - starty;
    statusdiv.innerHTML = 'Событие: touchmove<br /> Гориз. перемещение: ' + dist + 'px ' + dist2 + 'px';
    e.preventDefault();
    if (click != 2) {click = 0;}

    if (e.touches.length == 1) {
      if ((Math.abs(dist) % 7 == 0 || Math.abs(dist2) % 7 == 0)) {
        mouseoffset(dist, dist2);
        startx = touchobj.clientX;
        starty = touchobj.clientY;
      }
    }
    if (e.touches.length == 2) {
      if (Math.abs(dist2) % 10 == 0) {
        addToQueueWithPriority('/scroll', 'answer=' + dist2);
        startx = touchobj.clientX;
        starty = touchobj.clientY;
        scroll = true;
      }
    }
  }, false);

  box1.addEventListener('touchend', function(e) {
    statusdiv.innerHTML = 'Событие: отпустил';
    e.preventDefault();

    if (click >= 2) {
      click = 0;
      mouseClickUp()
    }
    if (fingers != 1) {
      click = 0;
    }

    // Сначала обрабатываем специальные жесты
    if (fingers == 2 && scroll == false) {
      statusdiv.innerHTML = 'TWO';
      RightClickUp()
      mouseClickUp()
    } else if (fingers == 3) {
      var inputField = document.getElementsByName('my_input')[0];
      inputField.focus();
      mouseClickUp()
    } else if (fingers == 4) {
      addToQueueWithPriority('/sleep', 'xcoord=' + dist + '&ycoord=' + dist2);
      mouseClickUp()
    }

    // Затем отправляем /qwe


    fingers = 0;
    scroll = false;
  }, false);

  if (!detecttouch) {
    document.body.addEventListener('mousedown', function(e){
      if (isContained(box1, e)) {
        var touchobj = e;
        ismousedown = true;
        startx = parseInt(touchobj.clientX);
        starty = parseInt(touchobj.clientY);
        statusdiv.innerHTML = 'Событие: touchstart<br /> ClientX: ' + startx + 'px';
        e.preventDefault();
      }
    }, false);

    document.body.addEventListener('mousemove', function(e) {
      if (ismousedown) {
        var touchobj = e;
        var dist = parseInt(touchobj.clientX) - startx;
        var dist2 = parseInt(touchobj.clientY) - starty;
        statusdiv.innerHTML = 'Событие: touchmove<br /> Гориз. перемещение: ' + dist + 'px ' + dist2 + 'px';
        e.preventDefault();
        addToQueueWithPriority('/', 'xcoord=' + dist + '&ycoord=' + dist2);
        fingers = 0;
      }
    }, false);

    document.body.addEventListener('mouseup', function(e) {
      var touchobj = e;
      ismousedown = false;
      statusdiv.innerHTML = 'Событие: touchend<br /> Координаты точки x: ' + touchobj.clientX + 'px';
      e.preventDefault();
      sendRequest2(touchobj.clientX, touchobj.clientY);
    }, false);
  }
}, false);
</script>
